# Default strategy, risk, filter and engine parameters.
# Edit these to tune behavior without touching code.

symbol:
  # ccxt exchange id — see https://docs.ccxt.com/#/README?id=exchanges
  exchange_id: "binance"
  # ccxt market symbol. PAXG is an ERC-20 token backed 1:1 by physical
  # gold; verify this pair is actually listed on your chosen exchange.
  symbol: "PAXG/USDT"
  display_name: "PAXG/USDT (tokenized gold)"

strategy:
  fast_ema: 12
  slow_ema: 26
  atr_period: 14
  stop_loss_atr_mult: 1.5
  take_profit_atr_mult: 3.0

# Pre-trade confirmation gate: an entry signal from `strategy` above is
# only actually placed as an order if ALL of these pass. Tune these
# against paper-trading / backtest results for your setup — tightening
# (e.g. raising volume_spike_multiplier, narrowing RSI bounds) means
# fewer but higher-conviction trades; loosening means more trades.
pretrade_filter:
  enabled: true
  # Higher timeframe used for the trend-alignment check. Should be
  # meaningfully larger than engine.bar_interval below (e.g. 4-6x).
  higher_timeframe: "1h"
  higher_timeframe_ema_period: 50
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  # Current bar's volume must be at least this many times the average of
  # the preceding `volume_lookback` bars to count as a "spike".
  volume_lookback: 20
  volume_spike_multiplier: 1.5

risk:
  # Fraction of account equity risked on a single trade (0.01 = 1%).
  risk_per_trade: 0.01
  # Max number of concurrent open positions.
  max_open_positions: 1
  # Stop trading for the rest of the day once losses reach this fraction
  # of starting-of-day equity (0.03 = 3%).
  max_daily_loss_pct: 0.03

engine:
  # How often to poll the price feed and re-evaluate signals, in seconds.
  poll_interval_seconds: 60
  # Bars of history to fetch each poll for indicator calculation.
  lookback_bars: 300
  # Entry-timeframe bar interval (ccxt timeframe string).
  bar_interval: "15m"
